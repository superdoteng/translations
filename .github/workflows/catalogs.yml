name: Catalogs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: bash scripts/check-catalogs.sh --base "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
