name: Catalogs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python -m pip install --require-hashes -r catalogs/requirements.txt
      - run: |
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            BASE_REF=HEAD
          fi
          bash catalogs/scripts/check-catalogs.sh --base "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
  export:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: catalog-export
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Publish validated catalog snapshot
        run: |
          main_commit=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main_commit" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded snapshot; the newer main run owns the export."
            exit 0
          fi
          catalog_commit=$(git subtree split --prefix=catalogs)
          git push origin "$catalog_commit":refs/heads/catalogs
